name: PR Size Labeler & Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  label-and-automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate PR Size Label & Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}

          # Get PR changed files list and stats
          FILES_JSON=$(gh pr view "$PR_NUMBER" --json files --jq '[.files[].path]')
          FILE_COUNT=$(echo "$FILES_JSON" | jq 'length')

          ADDITIONS=$(gh pr view "$PR_NUMBER" --json additions --jq '.additions')
          DELETIONS=$(gh pr view "$PR_NUMBER" --json deletions --jq '.deletions')
          TOTAL_DIFF=$((ADDITIONS + DELETIONS))

          # Check for high risk path modifications (DB, Notifications, Native Widgets)
          HAS_HIGH_RISK=$(echo "$FILES_JSON" | jq 'any(.[] | startswith("src/db/") or startswith("src/lib/notifications/") or startswith("src/widget/"))')

          SIZE_LABEL="size/M"

          if [ "$HAS_HIGH_RISK" = "true" ]; then
            if [ "$FILE_COUNT" -gt 10 ]; then
              SIZE_LABEL="size/L"
            else
              SIZE_LABEL="size/M"
            fi
          else
            if [ "$FILE_COUNT" -le 2 ] && [ "$TOTAL_DIFF" -le 30 ]; then
              SIZE_LABEL="size/XS"
            elif [ "$FILE_COUNT" -le 5 ] && [ "$TOTAL_DIFF" -le 150 ]; then
              SIZE_LABEL="size/S"
            elif [ "$FILE_COUNT" -le 15 ] && [ "$TOTAL_DIFF" -le 500 ]; then
              SIZE_LABEL="size/M"
            elif [ "$FILE_COUNT" -le 30 ]; then
              SIZE_LABEL="size/L"
            else
              SIZE_LABEL="size/XL"
            fi
          fi

          echo "Calculated Size: $SIZE_LABEL (Files: $FILE_COUNT, Diff: $TOTAL_DIFF, High Risk: $HAS_HIGH_RISK)"

          # Manage size labels on PR
          CURRENT_LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name][]')

          for label in $CURRENT_LABELS; do
            case "$label" in
              size/*)
                if [ "$label" != "$SIZE_LABEL" ]; then
                  gh pr edit "$PR_NUMBER" --remove-label "$label" || true
                fi
                ;;
            esac
          done

          gh pr edit "$PR_NUMBER" --add-label "$SIZE_LABEL" || true

          # Auto-merge if size/XS
          if [ "$SIZE_LABEL" = "size/XS" ]; then
            echo "size/XS detected: Enabling auto-merge (squash)"
            gh pr merge "$PR_NUMBER" --auto --squash || true
          fi
