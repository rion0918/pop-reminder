title: '[ADR相談] '
body:
  - type: markdown
    attributes:
      value: |
        判断に相談が必要な場合に使います。決定した内容はリポジトリのADRに記録し、関連するADR・PRへリンクしてください。
        [ADR運用ガイド・一覧](https://github.com/rion0918/pop-reminder/blob/main/docs/adr/README.md)
  - type: textarea
    id: context
    attributes:
      label: 背景と判断したいこと
      description: 解決したい問題と、判断に効く制約を記載してください。
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 選択肢と懸念
      description: 検討したい案、それぞれの利点・欠点、相談したい点を記載してください。
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: 関連リンク
      description: 関連するADR・PR・Issue・参考情報があれば記載してください。
