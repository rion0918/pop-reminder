// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Reanimated 4.1 expects Worklets libraries at the legacy CMake output location.
gradle.projectsEvaluated {
  def worklets = project(":react-native-worklets")
  def reanimated = project(":react-native-reanimated")
  [Debug: "Debug", Release: "RelWithDebInfo"].each { variant, cmakeVariant ->
    def syncLibraries = worklets.tasks.register("sync${variant}LibrariesForReanimated", Sync) {
      dependsOn worklets.tasks.named("externalNativeBuild${variant}")
      from(worklets.fileTree("${worklets.buildDir}/intermediates/cxx/${cmakeVariant}") {
        include "**/obj/*/libworklets.so"
      })
      into "${worklets.buildDir}/intermediates/cmake/${variant.toLowerCase()}/obj"
      eachFile { path = "${file.parentFile.name}/${file.name}" }
      includeEmptyDirs = false
    }
    reanimated.tasks.matching { it.name.startsWith("buildCMake${cmakeVariant}[") }.configureEach {
      dependsOn syncLibraries
    }
  }
}
